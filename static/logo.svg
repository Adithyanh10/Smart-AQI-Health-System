<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60" aria-label="Smart AQI Health Impact Analysis System logo">
  <title>AQI Health System Logo</title>
  <defs>
    <linearGradient id="gaugeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Circular gauge icon -->
  <circle cx="30" cy="30" r="24" fill="none" stroke="url(#gaugeGradient)" stroke-width="3" opacity="0.2"/>
  <!-- Gauge arc background (bottom half open) -->
  <path d="M 8 38 A 22 22 0 1 1 52 38" fill="none" stroke="#e0e7ff" stroke-width="4" stroke-linecap="round"/>
  <!-- Gauge arc fill (about 60% filled) -->
  <path d="M 8 38 A 22 22 0 0 1 46 16" fill="none" stroke="url(#gaugeGradient)" stroke-width="4" stroke-linecap="round"/>
  <!-- Gauge needle -->
  <line x1="30" y1="30" x2="46" y2="16" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <!-- Gauge center dot -->
  <circle cx="30" cy="30" r="3" fill="#6366f1"/>

  <!-- AQI text -->
  <text x="64" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="url(#textGradient)">AQI</text>
  <!-- Subtitle -->
  <text x="64" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#6366f1" letter-spacing="1.5">HEALTH IMPACT</text>
  <!-- Tagline -->
  <text x="64" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#8b5cf6" letter-spacing="0.5">Smart Analysis System</text>
</svg>
